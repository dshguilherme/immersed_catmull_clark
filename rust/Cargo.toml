[package]
name = "immersed_iga"
version = "0.1.0"
edition = "2021"
authors = ["dshgu"]
description = "High-performance zero-dependency Immersed Catmull-Clark Isogeometric Analysis & Octree AMR Stack"

[dependencies]
wgpu = "22.0"
pollster = "0.3"
bytemuck = { version = "1.16", features = ["derive"] }
cudarc = { version = "0.19", default-features = false, features = ["driver", "dynamic-loading", "cuda-12080", "nvrtc"] }
rayon = "1.10"
eframe = "0.29"

[[bin]]
name = "obstacle_course"
path = "src/bin/obstacle_course.rs"

[[bin]]
name = "wgpu_matrixfree_benchmark"
path = "src/bin/wgpu_matrixfree_benchmark.rs"

[[bin]]
name = "cuda_matrixfree_benchmark"
path = "src/bin/cuda_matrixfree_benchmark.rs"

[[bin]]
name = "topopt_3d"
path = "src/bin/topopt_3d.rs"

[[bin]]
name = "solve_cad"
path = "src/bin/solve_cad.rs"

[[bin]]
name = "cad_gui"
path = "src/bin/cad_gui.rs"

[[bin]]
name = "topopt_cad"
path = "src/bin/topopt_cad.rs"

[[bin]]
name = "verification_studies"
path = "src/bin/verification_studies.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Optimized but quick to build (no LTO): `cargo test --profile fast`
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
