[package]
name = "immersed_iga"
version = "0.1.0"
edition = "2021"
authors = ["dshgu"]
description = "High-performance zero-dependency Immersed Catmull-Clark Isogeometric Analysis & Octree AMR Stack"

[dependencies]
# Zero external dependencies for pure core algorithms.
# Standard library only (Vec, HashMap, BTreeMap, etc.)

[[bin]]
name = "obstacle_course"
path = "src/bin/obstacle_course.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
