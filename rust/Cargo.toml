[package]
name = "immersed_iga"
version = "0.1.0"
edition = "2021"
authors = ["dshgu"]
description = "High-performance zero-dependency Immersed Catmull-Clark Isogeometric Analysis & Octree AMR Stack"

[dependencies]
wgpu = "22.0"
pollster = "0.3"
bytemuck = { version = "1.16", features = ["derive"] }
cudarc = { version = "0.19", default-features = false, features = ["driver", "dynamic-loading", "cuda-12080", "nvrtc"] }
rayon = "1.10"

[[bin]]
name = "obstacle_course"
path = "src/bin/obstacle_course.rs"

[[bin]]
name = "wgpu_matrixfree_benchmark"
path = "src/bin/wgpu_matrixfree_benchmark.rs"

[[bin]]
name = "cuda_matrixfree_benchmark"
path = "src/bin/cuda_matrixfree_benchmark.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
